<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Builder</title>

    <!-- MODELOS BASE  -->
    <script defer src="../../Modelos/Alcalde.js"></script>
    <script defer src="../../Modelos/Mapa.js"></script>
    <script defer src="../../Modelos/Ciudadano.js"></script>
    <script defer src="../../Modelos/Edificio.js"></script>

    <!-- MODELOS DE EDIFICIOS  -->
    <script defer src="../../Modelos/Edificio_Residencial.js"></script>
    <script defer src="../../Modelos/Edificio_Comercial.js"></script>
    <script defer src="../../Modelos/Edificio_Industrial.js"></script>
    <script defer src="../../Modelos/Edificio_Servicio.js"></script>
    <script defer src="../../Modelos/Planta_Utilidad.js"></script>
    <script defer src="../../Modelos/Parque.js"></script>
    <script defer src="../../Modelos/Via.js"></script>

    <!-- MODELO PRINCIPAL-->
    <script defer src="../../Modelos/Ciudad.js"></script>

    <!--  ACCESO A DATOS -->
    <script defer src="../../Acceso_Datos/CiudadStorage.js"></script>
    <script defer src="../../Acceso_Datos/AlcaldeStorage.js"></script>
    <script defer src="../../Acceso_Datos/RankingStorage.js"></script>

    <!--  L�GICA DE NEGOCIO -->
    <script defer src="../../Negocio/Tamanos_Edificios.js"></script>
    <script defer src="../../Negocio/Sistema_Turnos.js"></script>
    <script defer src="../../Negocio/Puntuacion.js"></script>
    <script defer src="../../Negocio/Validaciones_y_Construcciones.js"></script>
    <script defer src="../../Negocio/Demoliciones.js"></script>
    <script defer src="../../Negocio/muestraDatos.js"></script>
    <script defer src="../../Negocio/Menu_Acciones.js"></script>
    
    <script defer src="../../Negocio/Importar_Mapa.js"></script>
    <script defer src="../../Negocio/Exportar_Mapa.js"></script>

    <!--  UI -->
    <script defer src="../../Negocio/ui/UiAlertas.js"></script>
    <script defer src="../../Negocio/ui/UiMensajes.js"></script>
    <script defer src="../../Negocio/ui/UiMapa.js"></script>
    <script defer src="../../Negocio/ui/UiRuta.js"></script>
    <script defer src="../../Negocio/ui/UiConstruccion.js"></script>
    <script defer src="../../Negocio/ui/UiDemolicion.js"></script>
    <script defer src="../../Negocio/ui/UIRanking.js"></script>
    
    <script defer src="../../Negocio/Configuracion.js"></script>

    <!--  APIS / EXTRA-->
    <script defer src="../../Acceso_Datos/Apis/ApiKeys.js"></script>
    <script defer src="../../Acceso_Datos/Apis/Clima.js"></script>
    <script defer src="../../Acceso_Datos/Apis/Noticias.js"></script>
    <script defer src="../../Acceso_Datos/Apis/Ruta.js"></script>

    <!-- PRINCIPAL  -->
    <script defer src="../../Negocio/Juego.js"></script>

    <!-- ESTILOS-->
     <link rel="stylesheet"href="../Estilo/base.css">
     <link rel="stylesheet" href="../Estilo/clima.css">
     <link rel="stylesheet" href="../Estilo/estadisticas.css">
     <link rel="stylesheet" href="../Estilo/hud.css">
     <link rel="stylesheet" href="../Estilo/mapa.css">
     <link rel="stylesheet" href="../Estilo/mensajes.css">
     <link rel="stylesheet" href="../Estilo/noticias.css">
     <link rel="stylesheet" href="../Estilo/responsive.css">
    
    <link rel="stylesheet" href="../Estilo/alertas.css">
</head>

<body>

    <!-- INFO CIUDAD -->
    <div id="infoCiudad">
        <div class="ciudad-header">
            <h1 id="datosCiudad"></h1>
            <div class="turno-inline">
                <div id="turnoBarra" aria-hidden="true">
                    <span class="turno-progreso"></span>
                </div>
                <span id="turnoTiempo">--s</span>
            </div>
        </div>
        <div class="recursosCiudad">
            <span id="Dinero"></span>
            <span id="Electricidad"></span>
            <span id="Agua"></span>
            <span id="Alimento"></span>
            <span id="Poblacion"></span>
            <span id="Felicidad"></span>
            <span id="Puntuacion"></span>
            <div id="contenedorDatos"></div>
        </div> 
    </div>

    <!-- CLIMA -->
    <div class="Clima" id="widgetClima">
        <div class="clima-principal">
            <span id="climaIcono"></span> 
            <span id="climaTemp">--°C</span>
        </div>
        <div class="clima-detalles">
            <div class="dato-clima">
                <strong>Estado:</strong> 
                <span id="climaCondicion">Cargando...</span>
            </div>
            <div class="dato-clima">
                <strong>Humedad:</strong> 
                <span id="climaHumedad">--%</span>
            </div>
            <div class="dato-clima">
                <strong>Viento:</strong> 
                <span id="climaViento">-- km/h</span>
            </div>
        </div>
    </div>

    <!-- MAPA -->
    <div id="mapaContainer">
        <table id="mapaTabla"></table>
    </div>

    <!-- MENSAJES -->
    <div id="mensajeAusuario"></div>

    <!-- NOTICIAS -->
    <div id="news-panel" class="city-builder-ui">
        <div id="nr">?? NEWS</div>
        <div id="news-list">
            <div class="news-ticker">
                <div class="news-track" id="news-track"></div>
            </div>
        </div>
    </div>

    
    <div class="huds">

        <div id="hudAcciones"> 
            <button id="btnConstruir" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Construir</span></button>
            <button id="btnDemoler" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Demoler</span></button>
            <button id="btnRuta" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Ruta</span></button>
            <button id="btnConfig" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Configuracion</span></button>
        </div>

        <div id="hudConfig" class="hidden">

            <button class="btn-volver btn-icon" data-back="acciones"><span class="btn-icon-img"></span><span class="btn-label">Volver</span></button>

            <button id="btnConfigTurno" class="btn-menuConfig">
                Configuracion de Turno
            </button>

            <button id="btnConfigRecursos" class="btn-menuConfig">
                Modificacion de Recursos
            </button>

            <button id="btnConfigFelicidad" class="btn-menuConfig">
                Felicidad y Servicios
            </button>

            <button id="btnConfigExtra" class="btn-menuConfig">
                Configuracion

            <button id="btnImportarTxt" class="btn-menuConfig">
                Importar mapa (.txt)
            </button>

            <button id="btnExportarMapa" class="btn-menuConfig">
                Exportar mapa (.txt)
            </button>
        </div>

        <div id="hudConfigTurno" class="hidden">
            <button class="btn-volver btn-icon" data-back="config"><span class="btn-icon-img"></span><span class="btn-label">Volver</span></button>
            <button id="btnCambioTiempo" class="btn-menuConfig"> cambiar duracion turno </button>
            <button id="btnCambioTasaAumento" class="btn-menuConfig">cambiar tasa de aumento de poblacion</button>
            <button id="btnCambioConsumo" class="btn-menuConfig">cambiar consumo por ciudadano</button>
        </div>

        <div id="hudConfigRecursos" class="hidden">
            <button class="btn-volver btn-icon" data-back="config"><span class="btn-icon-img"></span><span class="btn-label">Volver</span></button>
            <button id="btnModificarDinero" class="btn-menuConfig">modificar dinero</button>
            <button id="btnModificarElectricidad" class="btn-menuConfig">modificar electricidad</button>
            <button id="btnModificarAgua" class="btn-menuConfig">modificar agua</button>
            <button id="btnModificarAlimento" class="btn-menuConfig">modificar alimento</button>
      
        </div>

        <div id="hudConfigFelicidad" class="hidden">
            <button class="btn-volver btn-icon" data-back="config"><span class="btn-icon-img"></span><span class="btn-label">Volver</span></button>
            <button id="btnCambioBeneficioH" class="btn-menuConfig">cambiar beneficio de Hospitales</button>
            <button id="btnCambioBeneficioP" class="btn-menuConfig">cambiar beneficio de Policias</button>
            <button id="btnCambioBeneficioB" class="btn-menuConfig">cambiar beneficio de Bomberos</button>
        </div>

        <div id="hudConfigExtra" class="hidden">
            <button class="btn-volver btn-icon" data-back="config"><span class="btn-icon-img"></span><span class="btn-label">Volver</span></button>
            <button id="EliminarCiudad" class="btn-menuConfig">Eliminar ciudad</button>
        </div>



        <div id="hudConstruir" class="hidden">
            <button class="btn-volver btn-icon" data-back="acciones"><span class="btn-icon-img"></span><span class="btn-label">Volver</span></button>
            <button id="btnEdificios" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Edificios</span></button>
            <button id="btnVias" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Vias</span></button>
            <button id="btnParques" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Parques</span></button>
        </div>

        <div id="hudConstruirEdificios" class="hidden"> 
            <button class="btn-volver btn-icon" data-back="construir"><span class="btn-icon-img"></span><span class="btn-label">Volver</span></button>
            <button id="btnResidencias" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Residen<br>cias</span></button>
            <button id="btnComercios" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Comercios</span></button>
            <button id="btnIndustrias" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Industrias</span></button>
            <button id="btnServicios" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Servicios</span></button>
            <button id="btnUtilidades" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Utilidades</span></button>
        </div>

        <div id="hudResidencias" class="hidden">
            <button class="btn-volver btn-icon" data-back="edificios"><span class="btn-icon-img"></span><span class="btn-label">Volver</span></button>
            <button id="casa" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Casa</span></button>
            <button id="apartamento" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Apartamento</span></button>
        </div>

        <div id="hudComercios" class="hidden">
            <button class="btn-volver btn-icon" data-back="edificios"><span class="btn-icon-img"></span><span class="btn-label">Volver</span></button>
            <button id="tienda" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Tienda</span></button>
            <button id="centroComercial" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Centro comercial</span></button>
        </div>

        <div id="hudIndustrias" class="hidden">
            <button class="btn-volver btn-icon" data-back="edificios"><span class="btn-icon-img"></span><span class="btn-label">Volver</span></button>
            <button id="fabrica" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Fabrica</span></button>
            <button id="granja" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Granja</span></button>
        </div>

        <div id="hudServicios" class="hidden">
            <button class="btn-volver btn-icon" data-back="edificios"><span class="btn-icon-img"></span><span class="btn-label">Volver</span></button>
            <button id="policia" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Policia</span></button>
            <button id="bomberos" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Bomberos</span></button>
            <button id="hospital" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Hospital</span></button>
        </div>

        <div id="hudUtilidades" class="hidden">
            <button class="btn-volver btn-icon" data-back="edificios"><span class="btn-icon-img"></span><span class="btn-label">Volver</span></button>
            <button id="electrica" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Electrica</span></button>
            <button id="agua" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Agua</span></button>
        </div>

        <div id="hudConstruirVias" class="hidden">
            <button id="calle" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Calle</span></button>
            <button id="carrera" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Carrera</span></button>
            <button class="btn-volver btn-icon" data-back="construir"><span class="btn-icon-img"></span><span class="btn-label">Volver</span></button>
        </div>

    </div>
    
    <div id="Ranking">
        <button id="btnRanking" class="btn-icon"><span class="btn-icon-img"></span><span class="btn-label">Ranking</span></button>
        <div id="contenedorRanking" class="hidden"></div>
    </div>

</body>
</html>
