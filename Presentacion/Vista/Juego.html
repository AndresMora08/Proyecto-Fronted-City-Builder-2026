<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Builder</title>
    
    <script defer src="../../Negocio/Tamanos_Edificios.js"></script>
    <script defer src="../../Acceso_Datos/CiudadStorage.js" ></script>
    <script defer src="../Js/UiAlertas.js"></script>
    <script defer src="../Js/UiMensajes.js"></script>
    <script defer src="../Js/UiMapa.js"></script>
    <script defer src="../../Negocio/Juego.js"></script>
    <script defer src="../../Modelos/Alcalde.js"></script>
    <script defer src="../../Modelos/Ciudad.js"></script>
    <script defer src="../../Modelos/Mapa.js"></script>
    <script defer src="../../Modelos/Edificio.js"></script>
    <script defer src="../../Modelos/Edificio_Comercial.js"></script>
    <script defer src="../../Modelos/Edificio_Industrial.js"></script>
    <script defer src="../../Modelos/Edificio_Residencial.js"></script>
    <script defer src="../../Modelos/Edificio_Servicio.js"></script>
    <script defer src="../../Modelos/Parque.js"></script>
    <script defer src="../../Modelos/Planta_Utilidad.js"></script>
    <script defer src="../../Modelos/Via.js"></script>
    <script defer src="../Js/UiConstruccion.js"></script>
    <script defer src="../../Negocio/Validaciones_y_Construcciones.js"></script>
    <script defer src="../Js/UiDemolicion.js"></script>
    <script defer src="../../Negocio/Demoliciones.js"></script>
    <script defer src="../../Negocio/Menu_Acciones.js"></script>
    <script defer src="../../Negocio/Apis/ApiKeys.js"></script>
    <script defer src="../../Negocio/Apis/Clima.js"></script>
    <script defer src="../../Negocio/Apis/Noticias.js"></script>
    <link rel="stylesheet" href="../Estilo/Juego.css">
    <link rel="stylesheet" href="../Estilo/alertas.css">
</head>
<body>
    <div id="infoCiudad">
        <h1 id="datosCiudad"></h1>
        <div class="recursosCiudad">
            <span id="Dinero"></span>
            <span id="Electricidad"></span>
            <span id="Agua"></span>
            <span id="Alimento"></span>
            <span id="Poblacion"></span>
        </div> 
    </div>
    <div class="Clima" id="widgetClima">
        <div class="clima-principal">
            <span id="climaIcono"></span> <span id="climaTemp">--°C</span>
        </div>
        <div class="clima-detalles">
            <div class="dato-clima">
                <strong>Estado:</strong> <span id="climaCondicion">Cargando...</span>
            </div>
            <div class="dato-clima">
                <strong>Humedad:</strong> <span id="climaHumedad">--%</span>
            </div>
            <div class="dato-clima">
                <strong>Viento:</strong> <span id="climaViento">-- km/h</span>
            </div>
        </div>
    </div>
    <div id="mapaContainer"></div>

    <div id="mensajeAusuario"></div>
    
    <div id="news-panel" class="city-builder-ui">
        <div id="nr">
            🛰 NEWS
        </div>
        
        <div id="news-list">
            <div class="news-ticker">
                <div class="news-track" id="news-track">
                    <!-- noticias se insertan aquí -->
                </div>
            </div>
        </div>
    </div>
    
    <div class="huds">
        <div id="hudAcciones"> 
            <button id="btnConstruir"></button>
            <button id="btnDemoler"></button>
            <button id="btnRuta"></button>
            <button id="btnConfig"></button>
        </div>
            <div id="hudConstruir">
                <button class="btn-volver" data-back="acciones"></button>
                <button id="btnEdificios"></button>
                <button id="btnVias"></button>
                <button id="btnParques"></button>
            </div>
                <div id="hudConstruirEdificios"> 
                    <button class="btn-volver" data-back="construir"></button>
                    <button id="btnResidencias"></button>
                    <button id="btnComercios"></button>
                    <button id="btnIndustrias"></button>
                    <button id="btnServicios"></button>
                    <button id="btnUtilidades"></button>
                </div>
                    <div id="hudResidencias">
                        <button class="btn-volver" data-back="edificios"></button>
                        <button id="casa"></button>
                        <button id="apartamento"></button>
                    </div>
                    <div id="hudComercios">
                        <button class="btn-volver" data-back="edificios"></button>
                        <button id="tienda"></button>
                        <button id="centroComercial"></button>
                    </div>
                    <div id="hudIndustrias">
                        <button class="btn-volver" data-back="edificios"></button>
                        <button id="fabrica"></button>
                        <button id="granja"></button>
                    </div>
                    <div id="hudServicios">
                        <button class="btn-volver" data-back="edificios"></button>
                        <button id="policia"></button>
                        <button id="bomberos"></button>
                        <button id="hospital"></button>
                    </div>
                    <div id="hudUtilidades">
                        <button class="btn-volver" data-back="edificios"></button>
                        <button id="electrica"></button>
                        <button id="agua"></button>
                    </div>

                <div id="hudConstruirVias">
                    <button id="calle"></button>
                    <button id="carrera"></button>
                    <button class="btn-volver" data-back="construir"></button>
                </div>
    </div>
</body>
</html>
