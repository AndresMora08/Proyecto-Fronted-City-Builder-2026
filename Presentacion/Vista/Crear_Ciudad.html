<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear_Ciudad</title>
    <link rel="stylesheet" href="../Estilo/Crear_Ciudad.css">
    <link rel="stylesheet" href="../Estilo/alertas.css">
    <script defer src="../../Negocio/ui/UiAlertas.js"></script>
    <script defer src="../../Modelos/Alcalde.js"></script>
    <script defer src="../../Modelos/Ciudad.js"></script>
    <script defer src="../../Modelos/Mapa.js"></script>
    <script defer src="../../Acceso_Datos/CiudadStorage.js"></script>
    <script defer src="../../Acceso_Datos/AlcaldeStorage.js"></script>
    <script defer src="../../Acceso_Datos/Apis/ApiKeys.js"></script>
    <script defer src="../../Acceso_Datos/Apis/Clima.js"></script>
    <script defer src="../../Negocio/Crear_Ciudad.js"></script>
</head>
<body>
    <div class="contenedor">
        <h2>Crear Nueva Ciudad</h2>

        <div class="campo">
            <label>Nombre de la ciudad</label><br>
            <input id="nombreCiudadInput" type="text" name="nombreCiudad" required>
        </div>

        <div class="campo">
            <label>Nombre del alcalde</label><br>
            <input id="nombreAlcaldeInput" type="text" name="nombreAlcalde" required>
        </div>

        <div class="campo">
            <label>Región (Ubicación Real)</label><br>
            <input id="regionInput" type="text" name="region" list="listaSugerencias" autocomplete="off" required>
            <datalist id="listaSugerencias"></datalist>
        </div>

        <div class="campo-coordenadas">
            <label>O ingresar coordenadas manuales (Opcional):</label>
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <input id="latInput" type="number" placeholder="Latitud" step="any" style="width: 50%;">
                <input id="lonInput" type="number" placeholder="Longitud" step="any" style="width: 50%;">
            </div>
        </div>

        <div class="campo">
            <label>Tamano del mapa (entre 15x15 y 30x30)</label><br>
            <input id="tamanioInput"
                type="number"
                name="tamanio"
                min="15"
                max="30"
                required>
        </div>

        <div class="acciones">
            <button id="botonCrear" type="button">Crear Ciudad</button>
        </div>
    </div>
</body>
</html>
